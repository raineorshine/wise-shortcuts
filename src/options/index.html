<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wise Shortcuts — Options</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #0e0f0c;
        background: #ffffff;
        padding: 32px;
        max-width: 1020px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .subtitle {
        color: #454a4a;
        margin-bottom: 28px;
      }

      /* Flow page groups into 1, 2, or 3 columns depending on available width.
         Columns pack vertically so short groups don't leave row-track gaps. */
      #shortcuts {
        column-width: 300px;
        column-gap: 24px;
      }

      .group {
        break-inside: avoid;
        border: 1px solid #d7dbd5;
        border-radius: 12px;
        padding: 0 16px 8px;
        margin-bottom: 24px;
      }

      .group-heading {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #454a4a;
        margin-top: 16px;
        margin-bottom: 4px;
      }

      .shortcut {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 16px 0;
        border-top: 1px solid #d7dbd5;
      }

      .shortcut-label {
        font-weight: 600;
        font-size: 13px;
      }

      .shortcut-description {
        font-size: 12px;
        color: #454a4a;
      }

      .shortcut-description code {
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          monospace;
        font-size: 11px;
        padding: 1px 4px;
        background: #f0f2ef;
        border-radius: 4px;
      }

      .shortcut-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .shortcut-display {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px;
        border: 1px solid #d7dbd5;
        border-radius: 8px;
        background: #f0f2ef;
        font-size: 13px;
        min-width: 110px;
        height: 36px;
        cursor: pointer;
        font-family: inherit;
        color: inherit;
      }
      .shortcut-display:hover {
        border-color: #163300;
      }
      .shortcut-display.recording {
        border-color: #a8200d;
        background: #fdf1ef;
      }

      .shortcut-prompt {
        color: #a8200d;
        font-style: italic;
      }

      kbd {
        display: inline-block;
        padding: 1px 5px;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          monospace;
        font-size: 12px;
        line-height: 20px;
        color: #0e0f0c;
        background: #ffffff;
        border: 1px solid #d7dbd5;
        border-radius: 4px;
        box-shadow: inset 0 -1px 0 #d7dbd5;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        padding: 5px 12px;
        font-size: 13px;
        font-weight: 500;
        line-height: 20px;
        border-radius: 8px;
        border: 1px solid;
        cursor: pointer;
        white-space: nowrap;
      }

      .btn-secondary {
        color: #0e0f0c;
        background: #f0f2ef;
        border-color: #d7dbd5;
      }
      .btn-secondary:hover {
        background: #e8ebe6;
      }

      .btn-danger {
        color: #a8200d;
        background: #f0f2ef;
        border-color: #d7dbd5;
      }
      .btn-danger:hover {
        background: #fdf1ef;
        border-color: #a8200d;
      }
      .btn-danger:disabled,
      .btn-secondary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn-danger:disabled:hover {
        background: #f0f2ef;
        border-color: #d7dbd5;
      }

      .status {
        font-size: 12px;
        color: #163300;
        height: 16px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #d7dbd5;
      }

      .setting {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #d7dbd5;
      }
      .setting label {
        font-weight: 400;
        font-size: 13px;
      }
      .setting .hint {
        font-size: 12px;
        color: #454a4a;
      }

      .tooltip {
        position: fixed;
        display: none;
        background: #0e0f0c;
        color: #ffffff;
        font-size: 12px;
        line-height: 1.4;
        padding: 4px 8px;
        border-radius: 6px;
        pointer-events: none;
        white-space: pre-wrap;
        max-width: 280px;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <h1>Wise Shortcuts</h1>
    <p class="subtitle">Rebind the keyboard shortcuts this extension adds to Wise.</p>

    <div id="shortcuts"></div>

    <div class="setting">
      <input type="checkbox" id="debug-toggle" />
      <label for="debug-toggle"
        >Enable debug logging<br /><span class="hint">Logs shortcut activity to the page console.</span></label
      >
    </div>

    <div class="actions">
      <button id="reset-all-btn" class="btn btn-danger">Reset All</button>
      <span id="status" class="status"></span>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
